# Server
server.port=8081
server.servlet.context-path=/

# Database (H2 for dev, change to your DB for prod)
spring.datasource.url=jdbc:h2:mem:medistock;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=MediStockSecretKey2024VeryLongAndSecureKeyForJWTSigning!@#$%
app.jwt.expiration-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.medistock=DEBUG
logging.level.org.springframework.security=WARN

# MercadoPago
mercadopago.access-token=TU_ACCESS_TOKEN_AQUI
mercadopago.success-url=http://localhost:5173/payment/success
mercadopago.failure-url=http://localhost:5173/payment/failure
mercadopago.pending-url=http://localhost:5173/payment/pending
mercadopago.webhook-url=http://localhost:8081/api/store/payments/webhook
